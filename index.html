<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Mind Maps</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mind Maps">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E9EFEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1A1F" media="(prefers-color-scheme: dark)">
<style>
:root {
  color-scheme: light dark;
  --bg: #F2F2F7; --dot: #D3D5DE; --panel: rgba(255,255,255,.82); --ink: #171923; --ink2: #686B78; --line: rgba(120,125,145,.22);
  --on: #FFFFFF; --sel: #0A84FF;
  --b0: #0A84FF; --b1: #FF375F; --b2: #30D158; --b3: #FF9F0A; --b4: #BF5AF2; --b5: #FFD60A;
  --f-display: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-body: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html[data-theme="dark"] {
    --bg: #101116; --dot: #292B35; --panel: rgba(35,36,44,.88); --ink: #F5F5FA; --ink2: #A0A2AE; --line: rgba(160,165,185,.22);
    --on: #0C171C; --sel: #E6EFEE;
    --b0: #0A84FF; --b1: #FF6482; --b2: #30D158; --b3: #FF9F0A; --b4: #BF5AF2; --b5: #FFD60A;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
#importOptions { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 20px; background: color-mix(in srgb, var(--bg) 78%, transparent); }
#importOptions .import-dialog { width: min(560px, 100%); max-height: min(85vh, 720px); overflow: auto; padding: 22px; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); box-shadow: 0 18px 60px #0002; display: flex; flex-direction: column; gap: 14px; }
#importOptions h2 { margin: 0; font: 700 21px/1.2 var(--f-display); }
#importOptions p { margin: 0; color: var(--ink2); font-size: 14px; }
#importOptions textarea { width: 100%; min-height: 140px; resize: vertical; font: 400 15px/1.45 var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
#importOptions .import-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; overflow: hidden;
  padding: env(safe-area-inset-top, 0px) max(14px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(14px, env(safe-area-inset-left, 0px));
  -webkit-text-size-adjust: 100%; overscroll-behavior: none;
}
.screen { height: 100%; }
.btn {
  flex: none; font: 500 14px var(--f-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 0 15px; min-height: 42px; backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px); cursor: pointer; white-space: nowrap;
}
.btn:active:not(:disabled) { background: color-mix(in srgb, var(--ink) 8%, var(--panel)); }
.btn:disabled { opacity: .38; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.warn { border-color: var(--b1); color: var(--b1); }
.btn.sm { min-height: 34px; padding: 0 11px; font-size: 13px; }
:focus-visible { outline: 2px solid var(--b0); outline-offset: 2px; }

/* ---- library ---- */
#libScreen { overflow-y: auto; padding-block: 18px 40px; -webkit-overflow-scrolling: touch; }
.libwrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.libHead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.libHead h1 { font: 700 30px/1.05 var(--f-display); letter-spacing: -.015em; margin: 0 auto 0 0; }
.lead { margin: 0; color: var(--ink2); max-width: 62ch; }
.tip { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; color: var(--ink2); font-size: 13.5px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 16px; box-shadow: 0 8px 28px rgba(20,25,45,.045); backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card .open { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 64px; }
.card .open:focus-visible { outline: 2px solid var(--b0); outline-offset: 4px; border-radius: 6px; }
.card .name { font: 700 18px/1.2 var(--f-display); overflow-wrap: anywhere; text-wrap: balance; }
.card .meta { font: 500 11px var(--f-mono); color: var(--ink2); letter-spacing: .05em; text-transform: uppercase; }
.card .dots { display: flex; gap: 4px; }
.card .dots i { width: 14px; height: 6px; border-radius: 3px; }
.card .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.empty { color: var(--ink2); padding: 30px 0; }
.set { border: 1px solid var(--line); background: var(--panel); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; max-width: 640px; }
.set label.l { font: 500 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); }
.set input[type=text], .set input[type=password] { width: 100%; font: 400 16px var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 42px; }
.set .field { display: flex; flex-direction: column; gap: 6px; }
.set p { margin: 0; font-size: 13px; color: var(--ink2); }
.set .chk { display: flex; gap: 10px; align-items: center; min-height: 36px; }
.set .chk input { width: 22px; height: 22px; accent-color: var(--b0); }
#busy { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--bg) 82%, transparent); padding: 20px; }
#busy .box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(420px, 100%); display: flex; flex-direction: column; gap: 12px; }
#busy h2 { font: 700 18px/1.2 var(--f-display); margin: 0; }
#busy p { margin: 0; color: var(--ink2); font-size: 14px; overflow-wrap: anywhere; }
#busy .bar2 { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
#busy .bar2 i { display: block; height: 100%; width: 30%; background: var(--b0); border-radius: 3px; animation: slide 1.3s ease-in-out infinite; }
@keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
